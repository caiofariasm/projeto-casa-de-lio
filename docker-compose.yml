version: '3.8'

services:
  # Servidor Web & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: casa_de_lio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - rede_casa_de_lio

  # Aplicação FastAPI
  web:
    build: .
    container_name: casa_de_lio_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescreve endpoint S3 para comunicação interna da rede docker
      - S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./banco.db:/app/banco.db
      - ./uploads:/app/uploads
    expose:
      - "8000"
    depends_on:
      - minio
    networks:
      - rede_casa_de_lio

  # Armazenamento de Objetos MinIO (Compatível com AWS S3)
  minio:
    image: minio/minio:latest
    container_name: casa_de_lio_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY no .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY no .env}
    ports:
      - "127.0.0.1:9000:9000"   # API S3 somente local
      - "127.0.0.1:9001:9001"   # Console somente local
    volumes:
      - minio_data:/data
    networks:
      - rede_casa_de_lio

  # Inicializador automático para criar o bucket no MinIO na primeira execução
  minio-createbuckets:
    image: minio/mc:latest
    container_name: casa_de_lio_minio_setup
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY no .env}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY no .env}
      MINIO_BUCKET: ${S3_BUCKET_NAME:-casa-de-lio-uploads}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      until /usr/bin/mc ready myminio; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing myminio/$$MINIO_BUCKET;
      exit 0;
      "
    networks:
      - rede_casa_de_lio

volumes:
  minio_data:

networks:
  rede_casa_de_lio:
    driver: bridge
