<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa de Lió - Acesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 text-primary fw-bold">Casa de Lió</h3>
                        <form action="/login" method="POST">
                            <div class="mb-3">
                                <label class="form-label text-muted">Utilizador</label>
                                <input type="text" name="login" class="form-control form-control-lg" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted">Palavra-passe</label>
                                <input type="password" name="senha" class="form-control form-control-lg" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
