<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa de Lió - Acesso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Cores da ADRA exclusivas para a tela de login -->
    <style>
        :root {
            --verde-adra: #16463d;
            --laranja-adra: #e67e22;
        }
        
        body {
            /* Fundo verde escuro preenchendo a tela toda */
            background-color: var(--verde-adra); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            border-radius: 1.5rem; /* Bordas bem redondinhas */
            border: none;
        }

        .text-adra {
            color: var(--verde-adra);
        }

        .btn-login {
            background-color: var(--laranja-adra);
            border-color: var(--laranja-adra);
            color: white;
            font-weight: bold;
            border-radius: 0.8rem;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            filter: brightness(0.9);
            color: white;
            transform: translateY(-2px);
        }

        .form-control {
            border-radius: 0.8rem;
            border: 1px solid #dee2e6;
        }
        
        .form-control:focus {
            border-color: var(--verde-adra);
            box-shadow: 0 0 0 0.25rem rgba(22, 70, 61, 0.25);
        }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <!-- Cartão flutuante com sombra forte -->
                <div class="card shadow-lg p-4">
                    <div class="card-body">
                        <h2 class="text-center mb-2 fw-bold text-adra">Casa de Lió</h2>
                        <p class="text-center text-muted mb-4">Acesso ao sistema de gestão</p>
                        
                        <form action="/login" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-adra">Utilizador</label>
                                <input type="text" name="login" class="form-control form-control-lg bg-light" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-adra">Palavra-passe</label>
                                <input type="password" name="senha" class="form-control form-control-lg bg-light" required>
                            </div>
                            <button type="submit" class="btn btn-login btn-lg w-100 shadow-sm">Entrar no Sistema</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
