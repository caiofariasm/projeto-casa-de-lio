{% extends 'base.html' %}
{% block conteudo %}
    <h2 class="text-primary fw-bold mb-4">Controlo de Presenças</h2>

    <form method="GET" action="/" class="d-flex mb-4">
        <div class="input-group shadow-sm" style="max-width: 300px;">
            <span class="input-group-text bg-primary text-white border-primary fw-bold">Data:</span>
            <input type="date" name="data_chamada" class="form-control border-primary" value="{{ data_atual }}" onchange="this.form.submit()">
        </div>
    </form>

    {% for aluno in alunos %}
    <div class="card shadow-sm mb-3">
        <div class="card-body d-flex flex-column flex-md-row justify-content-between align-items-center">
            <div class="mb-3 mb-md-0 text-center text-md-start">
                <h4 class="card-title mb-2 fw-bold text-primary">{{ aluno['nome'] }}</h4>
                <!-- Aplicação da nova etiqueta visual com a cor laranja -->
                <span class="badge-institucional">Turma: {{ aluno['turma'] }}</span>
            </div>
            
            <div class="d-grid gap-2 d-md-block">
                <!-- Botões com cantos arredondados (rounded-pill) -->
                <a href="/registrar/{{ aluno['id'] }}/{{ data_atual }}/Presente" 
                   class="btn {% if aluno['status'] == 'Presente' %}btn-success{% else %}btn-outline-success{% endif %} rounded-pill px-4 fw-semibold">
                   Presente
                </a>
                <a href="/registrar/{{ aluno['id'] }}/{{ data_atual }}/Falta" 
                   class="btn {% if aluno['status'] == 'Falta' %}btn-danger{% else %}btn-outline-danger{% endif %} rounded-pill px-4 fw-semibold">
                   Falta
                </a>
                <a href="/registrar/{{ aluno['id'] }}/{{ data_atual }}/Falta justificada" 
                   class="btn {% if aluno['status'] == 'Falta justificada' %}btn-warning{% else %}btn-outline-warning{% endif %} rounded-pill px-4 fw-semibold">
                   Justificada
                </a>
            </div>
        </div>
    </div>
    {% endfor %}

    <hr class="mt-5">
    <div class="text-center mb-5">
        <!-- Botão Laranja de destaque para a ação de exportação -->
        <a href="/exportar" class="btn btn-warning rounded-pill px-5 py-2 fw-bold shadow-sm text-white">Baixar Relatório (Excel/CSV)</a>
    </div>
{% endblock %}
