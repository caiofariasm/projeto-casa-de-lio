{% extends 'base.html' %}
{% block conteudo %}
    <h1 class="text-center mb-4">Controlo de Presenças</h1>

    <!-- Seletor de Data Dinâmico -->
    <form method="GET" action="/" class="d-flex justify-content-center mb-4">
        <div class="input-group shadow-sm" style="max-width: 300px;">
            <span class="input-group-text bg-primary text-white border-primary">Data:</span>
            <input type="date" name="data_chamada" class="form-control border-primary" value="{{ data_atual }}" onchange="this.form.submit()">
        </div>
    </form>

    <!-- Lista Permanente de Alunos -->
    {% for aluno in alunos %}
    <div class="card shadow-sm mb-3">
        <div class="card-body d-flex flex-column flex-md-row justify-content-between align-items-center">
            <div class="mb-3 mb-md-0 text-center text-md-start">
                <h4 class="card-title mb-1">{{ aluno['nome'] }}</h4>
                <p class="card-text text-muted mb-0">Turma: {{ aluno['turma'] }}</p>
            </div>
            
            <div class="d-grid gap-2 d-md-block">
                <!-- Lógica de botões: Preenchido se selecionado, contorno se não -->
                <a href="/registrar/{{ aluno['id'] }}/{{ data_atual }}/Presente" 
                   class="btn {% if aluno['status'] == 'Presente' %}btn-success{% else %}btn-outline-success{% endif %}">
                   Presente
                </a>
                <a href="/registrar/{{ aluno['id'] }}/{{ data_atual }}/Falta" 
                   class="btn {% if aluno['status'] == 'Falta' %}btn-danger{% else %}btn-outline-danger{% endif %}">
                   Falta
                </a>
                <a href="/registrar/{{ aluno['id'] }}/{{ data_atual }}/Falta justificada" 
                   class="btn {% if aluno['status'] == 'Falta justificada' %}btn-warning{% else %}btn-outline-warning{% endif %}">
                   Falta Justificada
                </a>
            </div>
        </div>
    </div>
    {% endfor %}

    <hr class="mt-5">
    <div class="text-center mb-5">
        <a href="/exportar" class="btn btn-secondary">Baixar Relatório (Excel/CSV)</a>
    </div>
{% endblock %}
