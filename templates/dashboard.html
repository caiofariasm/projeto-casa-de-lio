{% extends 'base.html' %}
{% block conteudo %}
<div class="row mb-4">
    <div class="col-12">
        <h2 class="text-primary fw-bold">Painel de Controlo</h2>
        <p class="text-muted">Visão geral do sistema da Casa de Lió</p>
    </div>
</div>

<!-- Cartões de Resumo Rápidos -->
<div class="row mb-4">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 border-start border-primary border-4">
            <div class="card-body">
                <h5 class="text-muted mb-1">Total de Alunos</h5>
                <h2 class="fw-bold mb-0">{{ total_alunos }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm border-0 border-start border-success border-4">
            <div class="card-body">
                <h5 class="text-muted mb-1">Total de Presenças</h5>
                <h2 class="fw-bold mb-0 text-success">{{ dados_grafico['Presente'] }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card shadow-sm border-0 border-start border-danger border-4">
            <div class="card-body">
                <h5 class="text-muted mb-1">Total de Faltas</h5>
                <h2 class="fw-bold mb-0 text-danger">{{ dados_grafico['Falta'] }}</h2>
            </div>
        </div>
    </div>
</div>

<!-- Gráfico Circular -->
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white text-center fw-bold">
                Taxa Geral de Assiduidade
            </div>
            <div class="card-body d-flex justify-content-center">
                <!-- A área onde o Chart.js vai desenhar o gráfico -->
                <div style="width: 300px; height: 300px;">
                    <canvas id="graficoPresencas"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Puxando a biblioteca Chart.js da internet -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('graficoPresencas');
    new Chart(ctx, {
        type: 'doughnut', // Gráfico circular em formato de anel
        data: {
            labels: ['Presentes', 'Faltas'],
            datasets: [{
                data: [{{ dados_grafico['Presente'] }}, {{ dados_grafico['Falta'] }}],
                backgroundColor: ['#198754', '#dc3545'], // Cores Bootstrap (Verde e Vermelho)
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });
</script>
{% endblock %}
